org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Run Kotlin compilation inside the Gradle daemon. This keeps CI and sandboxed Windows
# environments (where the system temp directory may be locked down) reproducible.
kotlin.compiler.execution.strategy=in-process
